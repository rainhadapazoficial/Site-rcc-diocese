name: Importar Histórico de Notícias RCC Brasil

on:
  workflow_dispatch:
    inputs:
      pages:
        description: 'Número de páginas para importar (cada página = 50 notícias)'
        required: true
        default: '5'
      all:
        description: 'Importar TODO o histórico (1378+ notícias)? (true/false)'
        required: false
        default: 'false'

jobs:
  sync-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Rodar Sincronização do Histórico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_ALL: ${{ github.event.inputs.all }}
          INPUT_PAGES: ${{ github.event.inputs.pages }}
        run: |
          if [ "$INPUT_ALL" = "true" ]; then
            npx tsx scripts/sync-rcc-history.ts --all
          else
            if ! [[ "$INPUT_PAGES" =~ ^[0-9]+$ ]]; then
              echo "Erro: O parâmetro 'pages' deve conter apenas números inteiros."
              exit 1
            fi
            npx tsx scripts/sync-rcc-history.ts --pages="$INPUT_PAGES"
          fi
